add_to_shopping:
  name: Add to Shopping List
  description: Add a product to the EverShelf shopping list. If the item already exists, the quantity is increased by this amount.
  fields:
    name:
      name: Product name
      description: Name of the product to add.
      required: true
      example: "Milk"
      selector:
        text:
    quantity:
      name: Quantity
      description: Amount to add (optional).
      required: false
      example: 2
      selector:
        number:
          min: 0.001
          max: 9999
          step: 0.1
    unit:
      name: Unit
      description: "Unit of measurement (optional, e.g. pz, kg, l)."
      required: false
      example: "l"
      selector:
        text:

mark_used:
  name: Mark as Used
  description: Reduce the stock of an inventory item by a given quantity.
  fields:
    name:
      name: Product name
      description: Name of the inventory item (case-insensitive match).
      required: true
      example: "Olive Oil"
      selector:
        text:
    quantity:
      name: Quantity used
      description: Amount to subtract from the current stock.
      required: true
      example: 1
      selector:
        number:
          min: 0.001
          max: 9999
          step: 0.001
    unit:
      name: Unit
      description: Optional unit assertion. When provided, it must match the item's unit in EverShelf.
      required: false
      example: "l"
      selector:
        text:

refresh:
  name: Refresh Data
  description: Force an immediate refresh of all EverShelf sensor data.

suggest_recipe:
  name: Suggest Recipe
  description: Ask EverShelf AI to suggest a recipe using items expiring soonest.
  fields:
    location:
      name: Location
      description: Pantry location to focus on (e.g. frigo, freezer, spice_rack, cabinet). Leave empty for all locations.
      required: false
      example: "frigo"
      selector:
        text:

refresh_prices:
  name: Refresh Prices
  description: Recompute the shopping list estimated total from the existing price cache (no AI calls).

clear_expired:
  name: Clear Expired
  description: Remove expired inventory rows with zero stock from EverShelf.

list_inventory:
  name: List Inventory
  description: Return current EverShelf inventory rows, optionally filtered by location and taxonomy-aware search.
  fields:
    location:
      name: Location
      description: Optional inventory location to return.
      required: false
      selector:
        select:
          options:
            - label: Pantry
              value: dispensa
            - label: Fridge
              value: frigo
            - label: Freezer
              value: freezer
            - label: Spice Rack
              value: spice_rack
            - label: Cabinet
              value: cabinet
            - label: Other
              value: altro
    q:
      name: Search
      description: Optional taxonomy-aware search text. Matches product names, brands, categories, and EverShelf canonical ingredient taxonomy.
      required: false
      example: "fried tenders"
      selector:
        text:
    search:
      name: Search alias
      description: Alias for q, useful for clients that prefer a more descriptive field name.
      required: false
      example: "poultry"
      selector:
        text:
    config_entry_id:
      name: Config entry
      description: Optional EverShelf config entry ID when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

recipe_query:
  name: Query Recipes
  description: Return a compact, ranked EverShelf recipe page or the fixed recommendation carousel.
  fields:
    kind:
      name: Query kind
      description: Browse ranked recipes or return the 30-card recommendation set.
      required: true
      selector:
        select:
          options:
            - label: Browse
              value: browse
            - label: Recommendations
              value: recommendations
    q:
      name: Search
      description: Search recipe titles and ingredient names.
      required: false
      selector:
        text:
    sort:
      name: Sort
      description: Dominant recipe ranking mode for browse results.
      required: false
      default: availability
      selector:
        select:
          options:
            - label: Ingredients available
              value: availability
            - label: Expiring soon
              value: expiry
            - label: Alphabetical
              value: alphabetical
    availability_weight:
      name: Availability weight
      description: Strength of the ingredients-available score.
      required: false
      default: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
    expiry_weight:
      name: Expiry weight
      description: Strength of the expiring-ingredient score.
      required: false
      default: 25
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
    minimum_coverage:
      name: Minimum coverage
      description: Minimum percentage of required ingredients currently available.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 100
          step: 5
          mode: slider
    expiring_within_days:
      name: Expiring within
      description: Only return recipes using an ingredient expiring within this many days.
      required: false
      selector:
        number:
          min: 1
          max: 3650
          step: 1
          mode: box
    source:
      name: Source
      description: Optional recipe connector filter.
      required: false
      selector:
        text:
    locale:
      name: Locale
      description: Optional recipe locale, such as en or en-GB.
      required: false
      selector:
        text:
    limit:
      name: Page size
      description: Number of compact recipe cards to return.
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
    cursor:
      name: Cursor
      description: Opaque next-page cursor returned by an earlier browse response.
      required: false
      selector:
        text:
    config_entry_id:
      name: Config entry
      description: Optional EverShelf config entry ID when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

recipe_hydration:
  name: Hydrate Recipe Search
  description: Enqueue an idempotent Cookidoo search or poll an existing recipe search ID.
  fields:
    query:
      name: Search
      description: Search text to hydrate remotely. Provide this or Search ID, not both.
      required: false
      selector:
        text:
    search_id:
      name: Search ID
      description: Existing hydration search ID to poll. Provide this or Search, not both.
      required: false
      selector:
        text:
    source:
      name: Source
      description: Remote connector. Cookidoo is currently supported.
      required: false
      default: cookidoo
      selector:
        select:
          options:
            - label: Cookidoo
              value: cookidoo
    locale:
      name: Locale
      description: Optional remote recipe locale, such as en or en-GB.
      required: false
      selector:
        text:
    force:
      name: Force refresh
      description: Requeue an equivalent completed search even when it is still fresh.
      required: false
      default: false
      selector:
        boolean:
    config_entry_id:
      name: Config entry
      description: Optional EverShelf config entry ID when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

recipe_detail:
  name: Get Recipe Detail
  description: Return the bounded recipe_detail_v1 projection for one EverShelf recipe.
  fields:
    recipe_id:
      name: Recipe ID
      description: Positive EverShelf catalog recipe ID.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    config_entry_id:
      name: Config entry
      description: Optional EverShelf config entry ID when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

recipe_ingredient_override:
  name: Override Recipe Ingredient Availability
  description: Persist a display-only have/missing override for one revision-bound recipe ingredient without changing inventory, scoring, or grocery eligibility.
  fields:
    recipe_id:
      name: Recipe ID
      description: Positive EverShelf catalog recipe ID.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    ingredient_key:
      name: Ingredient key
      description: Stable ri:<position>:<hash> key from recipe_detail_v1.
      required: true
      selector:
        text:
    position:
      name: Ingredient position
      description: Nonnegative source position from recipe_detail_v1.
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
    availability:
      name: Availability override
      description: Mark the row as have or missing for display, or clear to restore the EverShelf result.
      required: true
      selector:
        select:
          options:
            - have
            - missing
            - clear
    feedback_token:
      name: Feedback token
      description: Current opaque ingredient evidence token from recipe_detail_v1.
      required: true
      selector:
        text:
    idempotency_key:
      name: Idempotency key
      description: Stable 1-128 character command key. Reuse it only for the same override request.
      required: true
      selector:
        text:
    config_entry_id:
      name: Config entry
      description: EverShelf config entry ID. Required when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

recipe_identity_feedback:
  name: Record Recipe Ingredient Match Feedback
  description: Record explicit correct/wrong feedback for the matched product or closest identity label. Feedback settles into proposal-only ontology evidence and never applies automatically.
  fields:
    recipe_id:
      name: Recipe ID
      description: Positive EverShelf catalog recipe ID.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    ingredient_key:
      name: Ingredient key
      description: Stable ri:<position>:<hash> key from recipe_detail_v1.
      required: true
      selector:
        text:
    position:
      name: Ingredient position
      description: Nonnegative source position from recipe_detail_v1.
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
    verdict:
      name: Match verdict
      description: Confirm that the displayed target is correct or report that it is wrong.
      required: true
      selector:
        select:
          options:
            - correct
            - wrong
    target_kind:
      name: Feedback target
      description: The inventory product or closest identity label shown by recipe_detail_v1.
      required: true
      selector:
        select:
          options:
            - matched_product
            - closest_match
    feedback_token:
      name: Feedback token
      description: Current opaque ingredient evidence token from recipe_detail_v1.
      required: true
      selector:
        text:
    idempotency_key:
      name: Idempotency key
      description: Stable 1-128 character command key. Reuse it only for the same feedback request.
      required: true
      selector:
        text:
    config_entry_id:
      name: Config entry
      description: EverShelf config entry ID. Required when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

recipe_ingredient_decision:
  name: Decide Recipe Ingredient
  description: Atomically assume availability, bind a selected stocked product as positive identity evidence, or reject the exact displayed match. Model work is queued asynchronously and never applied automatically.
  fields:
    recipe_id:
      name: Recipe ID
      description: Positive EverShelf catalog recipe ID.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    ingredient_key:
      name: Ingredient key
      description: Stable ingredient key from recipe_detail_v1.
      required: true
      selector:
        text:
    position:
      name: Ingredient position
      description: Nonnegative source position from recipe_detail_v1.
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
    action:
      name: Decision
      description: Assume the ingredient is available, select an exact stocked product, or reject the current exact match.
      required: true
      selector:
        select:
          options:
            - assume_have
            - select_inventory_product
            - reject_current_match
    selected_product_id:
      name: Selected product ID
      description: Product-level EverShelf inventory ID required only for select_inventory_product.
      required: false
      selector:
        number:
          min: 1
          step: 1
          mode: box
    expected_target_product_id:
      name: Expected matched product ID
      description: Exact displayed product ID for reject_current_match. Omit when no exact target was displayed.
      required: false
      selector:
        number:
          min: 1
          step: 1
          mode: box
    feedback_token:
      name: Feedback token
      description: Current active-score ingredient evidence token from recipe_detail_v1.
      required: true
      selector:
        text:
    idempotency_key:
      name: Idempotency key
      description: Reuse the same key after an ambiguous transport failure.
      required: true
      selector:
        text:
    action_origin:
      name: Action origin
      description: Exact trusted UI or operator command origin.
      required: false
      default: home_assistant
      selector:
        select:
          options:
            - home_assistant
            - react_dashboard
            - operator
    config_entry_id:
      name: Config entry
      description: EverShelf config entry ID. Required when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

recipe_planner_add:
  name: Add Recipe to My Week
  description: Assign a Cookidoo-origin recipe to a date in the configured Cookidoo account planner. This is an account action, not a direct Thermomix device push.
  fields:
    recipe_id:
      name: Recipe ID
      description: EverShelf recipe ID. EverShelf resolves the Cookidoo external ID server-side.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    date:
      name: Date
      description: ISO date from today through 365 days from today.
      required: true
      selector:
        date:
    provider_action_token:
      name: Provider action token
      description: Opaque recipe/origin/catalog revision token from recipe_detail_v1.
      required: true
      selector:
        text:
    idempotency_key:
      name: Idempotency key
      description: Stable command key. Reuse it after an ambiguous transport failure.
      required: true
      selector:
        text:
    config_entry_id:
      name: Config entry
      description: EverShelf config entry ID. Required when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

recipe_grocery_add:
  name: Add Recipe Groceries
  description: Add selected missing ingredients to EverShelf, then deduplicate and mirror eligible items to a Home Assistant todo list.
  fields:
    recipe_id:
      name: Recipe ID
      description: Positive EverShelf catalog recipe ID.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    selections:
      name: Ingredient selections
      description: One to 100 recipe ingredient objects containing a stable ri:<position>:<hash> key and optional nonnegative position.
      required: true
      example:
        - key: "ri:2:0123456789abcdef"
          position: 2
      selector:
        object:
    idempotency_key:
      name: Idempotency key
      description: Stable 1-128 character client command key using letters, digits, dot, underscore, colon, or hyphen. Reuse it only for the same recipe and selections.
      required: true
      example: "ha-recipe-123-command-01"
      selector:
        text:
    todo_entity_id:
      name: Home Assistant todo list
      description: User-facing todo list to mirror eligible items into. Defaults to todo.shopping_list.
      required: false
      default: todo.shopping_list
      selector:
        entity:
          domain: todo
    config_entry_id:
      name: Config entry
      description: EverShelf config entry ID. Required when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

delete_inventory:
  name: Delete Inventory Row
  description: Delete all or part of a specific EverShelf inventory row by inventory ID.
  fields:
    inventory_id:
      name: Inventory ID
      description: EverShelf inventory row ID to delete.
      required: true
      selector:
        number:
          min: 1
          mode: box
    quantity:
      name: Quantity
      description: Optional quantity to delete. Omit to delete the entire row.
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config entry
      description: Optional EverShelf config entry ID when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

delete_inventory_item:
  name: Delete Inventory Item
  description: Delete one item from a specific EverShelf inventory row. Rows with quantity greater than 1 are decremented by 1.
  fields:
    inventory_id:
      name: Inventory ID
      description: EverShelf inventory row ID to delete one item from.
      required: true
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config entry
      description: Optional EverShelf config entry ID when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

update_inventory_item:
  name: Update Inventory Item
  description: Update one item from a specific EverShelf inventory row, splitting a quantity greater than 1 into a separate row when needed.
  fields:
    inventory_id:
      name: Inventory ID
      description: EverShelf inventory row ID to update one item from.
      required: true
      selector:
        number:
          min: 1
          mode: box
    expiry_date:
      name: Expiry date
      description: Expiry date for this one item in YYYY-MM-DD format. Use an empty string to clear the date.
      required: true
      selector:
        text:
    config_entry_id:
      name: Config entry
      description: Optional EverShelf config entry ID when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

set_inventory_prepared_food:
  name: Set Inventory Prepared Food
  description: Mark some or all units of an EverShelf inventory row as a prepared food item. Prepared items are grouped under the existing prepared meal taxonomy term instead of being classified by ingredient. Passing a quantity below the row quantity splits those units into their own row so the rest of the batch keeps its previous state.
  fields:
    inventory_id:
      name: Inventory ID
      description: EverShelf inventory row ID to update.
      required: true
      selector:
        number:
          min: 1
          mode: box
    prepared_food:
      name: Prepared food
      description: Whether the selected units are prepared food items.
      required: true
      selector:
        boolean:
    quantity:
      name: Quantity
      description: How many units to apply this to. Defaults to the whole row.
      required: false
      selector:
        number:
          min: 0.001
          step: 0.001
          mode: box
    config_entry_id:
      name: Config entry
      description: Optional EverShelf config entry ID when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

resolve_barcode:
  name: Resolve Barcode
  description: Resolve a scanned barcode through EverShelf and return matching product data.
  fields:
    barcode:
      name: Barcode
      description: Barcode digits to resolve.
      required: true
      example: "3017620422003"
      selector:
        text:
    config_entry_id:
      name: Config entry
      description: Optional EverShelf config entry ID when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

suggest_location:
  name: Suggest Storage Location
  description: Return the previous storage location for an exact barcode or manually entered product name, otherwise use EverShelf's background AI classifier.
  fields:
    name:
      name: Product name
      description: Product name used for exact manual-name history and AI classification.
      required: true
      example: "Milk"
      selector:
        text:
    mode:
      name: Entry mode
      description: Barcode mode checks barcode history before AI. Manual mode also checks exact case-insensitive name history.
      required: false
      default: manual
      selector:
        select:
          options:
            - label: Barcode scan
              value: barcode
            - label: Manual name
              value: manual
    barcode:
      name: Barcode
      description: Scanned barcode. Required when entry mode is barcode.
      required: false
      example: "3017620422003"
      selector:
        text:
    category:
      name: Category
      description: Optional product category from barcode lookup to improve classification.
      required: false
      selector:
        text:
    product_id:
      name: Product ID
      description: Current committed EverShelf product ID returned by prepare_scanned_product.
      required: false
      selector:
        number:
          min: 1
          step: 1
          mode: box
    product_fingerprint:
      name: Product fingerprint
      description: Current server-derived product fingerprint returned by prepare_scanned_product. Never synthesize this value.
      required: false
      selector:
        text:
    config_entry_id:
      name: Config entry
      description: Optional EverShelf config entry ID when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

prepare_scanned_product:
  name: Prepare Scanned Product
  description: Create or update the current scanned product without adding inventory, returning its committed ID and server-derived fingerprint.
  fields:
    product_id:
      name: Product ID
      description: Existing or previously prepared EverShelf product ID to update.
      required: false
      selector:
        number:
          min: 1
          step: 1
          mode: box
    id:
      name: Product ID alias
      description: Backend-compatible alias for product_id. If both are supplied they must match.
      required: false
      selector:
        number:
          min: 1
          step: 1
          mode: box
    name:
      name: Product name
      description: Current product name to commit.
      required: true
      selector:
        text:
    barcode:
      name: Barcode
      description: Scanned product barcode.
      required: false
      selector:
        text:
    brand:
      name: Brand
      description: Product brand.
      required: false
      selector:
        text:
    category:
      name: Category
      description: Product category.
      required: false
      selector:
        text:
    image_url:
      name: Image URL
      description: Product image URL from barcode lookup.
      required: false
      selector:
        text:
    unit:
      name: Unit
      description: Product unit such as pz, kg, or l.
      required: false
      selector:
        text:
    default_quantity:
      name: Default quantity
      description: Default package quantity for the product.
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: 0.001
          mode: box
    notes:
      name: Notes
      description: Optional bounded product notes.
      required: false
      selector:
        text:
          multiline: true
    package_unit:
      name: Package unit
      description: Package unit for configurable packages.
      required: false
      selector:
        text:
    shopping_name:
      name: Shopping name
      description: Optional product name used by the shopping list.
      required: false
      selector:
        text:
    nutriments:
      name: Nutriments
      description: Optional bounded flat nutriment object from product lookup.
      required: false
      selector:
        object:
    prepared_food:
      name: Prepared food
      description: Whether this product is prepared food.
      required: false
      selector:
        boolean:
    config_entry_id:
      name: Config entry
      description: Optional EverShelf config entry ID when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

read_expiry_image:
  name: Read Expiry Image
  description: Send an expiry-label image to EverShelf OCR/Gemini and return the parsed expiry date.
  fields:
    image:
      name: Base64 image
      description: Base64-encoded JPEG/PNG image data, with or without a data:image/... prefix. Provide exactly one image source.
      required: false
      selector:
        text:
          multiline: true
    image_path:
      name: Image path
      description: Path to an image file on the Home Assistant host. The path must be allowed by Home Assistant.
      required: false
      example: "/config/www/evershelf-expiry.jpg"
      selector:
        text:
    camera_entity_id:
      name: Camera entity
      description: Camera entity to capture and send. Provide exactly one image source.
      required: false
      selector:
        entity:
          domain: camera
    config_entry_id:
      name: Config entry
      description: Optional EverShelf config entry ID when multiple EverShelf instances are configured.
      required: false
      selector:
        text:

add_scanned_item:
  name: Add Scanned Item
  description: Save a scanned product if needed and add it to EverShelf inventory with bounded busy retries and idempotent inventory writes. Matching unopened inventory batches merge only when product, location, expiry date, and sealed state match.
  fields:
    idempotency_key:
      name: Idempotency key
      description: Optional stable command key. Reusing it with the same payload safely replays the original inventory result instead of adding stock twice.
      required: false
      selector:
        text:
    product_id:
      name: Product ID
      description: Existing EverShelf product ID. When omitted, the service creates or merges a product first.
      required: false
      selector:
        number:
          min: 1
          mode: box
    name:
      name: Product name
      description: Product name to save or add.
      required: true
      example: "Milk"
      selector:
        text:
    barcode:
      name: Barcode
      description: Scanned product barcode.
      required: false
      example: "3017620422003"
      selector:
        text:
    brand:
      name: Brand
      description: Product brand.
      required: false
      selector:
        text:
    category:
      name: Category
      description: Product category.
      required: false
      selector:
        text:
    image_url:
      name: Image URL
      description: Product image URL from barcode lookup.
      required: false
      selector:
        text:
    quantity:
      name: Quantity
      description: Quantity to add to the matching inventory batch.
      required: false
      default: 1
      selector:
        number:
          min: 0.001
          max: 100000
          step: 0.001
          mode: box
    location:
      name: Location
      description: Inventory location.
      required: false
      default: dispensa
      selector:
        select:
          options:
            - dispensa
            - frigo
            - freezer
            - spice_rack
            - cabinet
            - altro
    expiry_date:
      name: Expiry date
      description: Expiration date in YYYY-MM-DD format. Different dates create separate unopened inventory batches.
      required: false
      example: "2026-06-30"
      selector:
        date:
